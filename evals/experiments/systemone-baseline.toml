# `mise run eval:systemone:baseline`: the description style grid, plus a control that forces a
# 16-option tournament onto Jev, so the tournament's own cost shows on one model.
# An entry names System 1 with `model` and `style`, or with `opponent`: an opponent settings
# file, relative to this one, as every surface reads them.

[[experiment]]
name = "jev-rich"
model = "typesafe/jev-latest"
style = "rich"

[[experiment]]
name = "jev-terse"
opponent = "opponents/jev-terse.json"

[[experiment]]
name = "jev-rich-cap16"
model = "typesafe/jev-latest"
style = "rich"
max_options = 16

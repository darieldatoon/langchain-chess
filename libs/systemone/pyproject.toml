[project]
name = "langchain-chess-systemone"
version = "0.1.0"
description = "A System 1 move ranker (SemIf or Jev) as langchain-chess middleware"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Dariel Dato-on" }]
dependencies = [
    "langchain-chess",
    "langchain-typesafe>=0.0.1a3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "langchain_chess_systemone"
module-root = ""

[tool.uv.sources]
langchain-chess = { workspace = true }

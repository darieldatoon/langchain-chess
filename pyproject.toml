# Virtual workspace root: no package of its own. Members are listed explicitly because a glob
# over apps/ would include apps/web, which has no pyproject.toml.
[tool.uv.workspace]
members = ["libs/chess", "libs/systemone", "libs/cli", "apps/server", "evals"]

# `workspace = true` for every member is what lets `uvx --from git+…#subdirectory=libs/cli`
# resolve the unpublished siblings from the same commit.
[tool.uv.sources]
langchain-chess = { workspace = true }
langchain-chess-systemone = { workspace = true }
langchain-chess-cli = { workspace = true }
langchain-chess-server = { workspace = true }
langchain-chess-evals = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.82",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "langgraph-cli[inmem]==0.4.40",
    "httpx>=0.28.1",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-xdist>=3.8",
    "playwright>=1.63,<2",
]

[tool.uv]
# langchain-typesafe is still an alpha release
prerelease = "if-necessary"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["libs/chess", "libs/systemone", "libs/cli", "apps/server", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "TCH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "TC"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["libs", "apps/server", "evals"]

# Tests build state and requests from loose dict literals; the packages stay strict.
[[tool.ty.overrides]]
include = ["**/tests/**"]
rules = { invalid-argument-type = "ignore", invalid-assignment = "ignore", not-subscriptable = "ignore", unresolved-attribute = "ignore", invalid-key = "ignore" }

[tool.pytest.ini_options]
testpaths = [
    "libs/chess/tests",
    "libs/systemone/tests",
    "libs/cli/tests",
    "apps/server/tests",
    "evals/tests",
]
asyncio_mode = "auto"
markers = [
    "live: hits the real LLM Gateway (run with -m live --no-cov)",
    "e2e: drives the built web UI in a browser (mise run test:e2e)",
]
addopts = [
    "-m", "not live and not e2e",
    "--import-mode=importlib",
    "--cov=langchain_chess",
    "--cov=langchain_chess_systemone",
    "--cov=langchain_chess_cli",
    "--cov=langchain_chess_server",
    "--cov=langchain_chess_evals",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "if __name__ == .__main__.:"]

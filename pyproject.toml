[project]
name = "jev-chess"
version = "0.1.0"
description = "System 1 vs System 2 chess: Jev, reasoning LLMs, and a confidence-gated hybrid, graded by Stockfish"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Dariel Datoon" }]
dependencies = [
    "chess>=1.11",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langchain-typesafe>=0.0.1a3",
    "langsmith>=0.13",
    "pydantic>=2.13",
    "typer>=0.27",
    "rich>=15",
    "pydantic-settings>=2.10",
    "langchain>=1.4",
    "fastapi>=0.141.1",
]

[project.scripts]
jev-chess = "jev_chess.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.82",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "langgraph-cli[inmem]>=0.4.31",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT", "TCH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real APIs or engines (deselect with -m 'not live')",
]
addopts = "-m 'not live' --cov=jev_chess --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["jev_chess"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.uv]
# langchain-typesafe is still an alpha release
prerelease = "if-necessary"

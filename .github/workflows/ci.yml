name: ci

on:
  pull_request:
    paths-ignore: ["**/*.md", "plans/**", "openwiki/**"]
  # The deploy workflows call this, so the checks a merge deploys behind are these same checks.
  workflow_call:
    inputs:
      ref:
        description: The exact commit to check; empty checks the triggering one.
        type: string
        default: ""

permissions:
  contents: read

# A called run gets its own group: a new merge must not cancel the checks of a deploy in flight.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          web: false

      - name: Check
        run: mise run check:python

      - name: Test
        run: mise run test:python

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          python: false

      - name: Check
        run: mise run check:web

      - name: Test
        run: mise run test:web

      # `langsmith apps push` uploads apps/review whole: 5 MiB, 500 files, text only.
      - name: Review app upload budget
        run: mise run review:size

  # The built web UI in Chromium, against langgraph dev with a fake model.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Chromium
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: mise run test:e2e

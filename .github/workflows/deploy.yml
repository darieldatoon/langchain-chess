name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      # `mise run setup`, but failing on a stale uv.lock and without git hooks.
      - name: Install
        run: |
          uv sync --all-packages --all-groups --locked
          pnpm install --frozen-lockfile

      - name: Check
        run: mise run check

      - name: Test
        run: mise run test

      # `langgraph deploy` re-sends the env file as the revision's secrets on every deploy, so
      # the file must carry the full runtime set or a redeploy could drop them.
      - name: Write deployment env
        run: |
          cat > .env <<EOF
          LANGSMITH_GATEWAY=true
          LANGSMITH_GATEWAY_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          TYPESAFE_BASE_URL=https://gateway.smith.langchain.com
          TYPESAFE_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          EOF

      # Builds the web UI into the server package, then the image, then deploys.
      - name: Build and deploy to LangSmith
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: mise run deploy -- --no-input

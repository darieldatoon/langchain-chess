name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install
        run: |
          uv sync --all-groups
          pnpm --dir frontend install --frozen-lockfile

      - name: Check and test
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run ty check
          uv run pytest -q
          pnpm --dir frontend exec vp check
          pnpm --dir frontend exec vp test --run --coverage

      - name: Build UI into the Python package
        run: pnpm --dir frontend exec vp build

      # `langgraph deploy` re-sends the env file as the revision's secrets on every deploy, so
      # the file must carry the full runtime set or a redeploy could drop them.
      - name: Write deployment env
        run: |
          cat > .env <<EOF
          LANGSMITH_GATEWAY=true
          LANGSMITH_GATEWAY_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          TYPESAFE_BASE_URL=https://gateway.smith.langchain.com/typesafe
          TYPESAFE_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          EOF

      - name: Build image and deploy to LangSmith
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: uv run langgraph deploy --no-remote --name jev-chess-app --deployment-type dev --no-input

name: deploy

on:
  push:
    branches: [main]
    # A path missing here is a silent stale deploy: when the agent gains a dependency, add it.
    # Over-include rather than under.
    paths:
      - libs/chess/**
      - libs/systemone/**
      - libs/cli/pyproject.toml
      - apps/server/**
      - uv.lock
      - pyproject.toml
      - .python-version
      - langgraph.json
      - .dockerignore
      - mise.toml
      - mise.lock
      - .github/actions/setup/**
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
      - scripts/superseded.sh
      - scripts/agent-tags.sh
  # Ignores the path filters: the way to retry a failed deploy that no later push will redo.
  # Runs only from main; the jobs skip on any other ref.
  workflow_dispatch:

permissions:
  contents: read

# The whole run, CI included, holds the lock, so deploys go out in push order. A newer run
# replaces a pending older one, which is safe only because every run here deploys the agent:
# keep the review app in its own workflow and group.
concurrency:
  # Per ref: a branch dispatch, which skips, must not replace a pending main run.
  group: deploy-agent-${{ github.ref }}
  # Every run waits its turn: a newer arrival must never cancel a pending deploy.
  queue: max

jobs:
  # Inside the lock, so a retried or replaced older run still ships main as it is now. CI and
  # the deploy both use this SHA, so what deploys is exactly what passed.
  tip:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "main is at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: tip
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tip.outputs.sha }}

  agent:
    needs: [tip, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tip.outputs.sha }}

      - uses: ./.github/actions/setup
        with:
          web: false

      # `langgraph deploy` re-sends the env file as the revision's secrets on every deploy, so
      # the file must carry the full runtime set or a redeploy could drop them.
      - name: Write deployment env
        run: |
          cat > .env <<EOF
          LANGSMITH_GATEWAY=true
          LANGSMITH_GATEWAY_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          TYPESAFE_BASE_URL=https://gateway.smith.langchain.com
          TYPESAFE_API_KEY=${{ secrets.LC_GATEWAY_KEY }}
          OAUTH_CLIENT_ID=${{ vars.OAUTH_CLIENT_ID }}
          ALLOWED_ORGANIZATION_ID=${{ vars.LANGSMITH_ORGANIZATION_ID }}
          EOF

      # Re-running only this job reuses the earlier tip and CI. Main may have moved since; that
      # is fine unless it changed the agent, whose newer run then deploys instead.
      - name: Check no newer commit changes the agent
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ needs.tip.outputs.sha }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth 1 origin "$main"
          changed=$(bash scripts/superseded.sh .github/workflows/deploy.yml "$TESTED" "$main")
          if [[ -n "$changed" ]]; then
            summary="main moved from $TESTED to $main and changed the agent (${changed//$'\n'/, })"
            # Skip only when a newer run exists: a push that triggers none (e.g. [skip ci]) must stay red.
            newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main" \
              --jq "[.workflow_runs[] | select(.run_number > $GITHUB_RUN_NUMBER and .conclusion != \"cancelled\")] | length")
            if (( newer > 0 )); then
              echo "::notice::$summary; a newer run deploys it, so this one skips."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$summary; re-run all jobs, not just this one."
            exit 1
          fi

      # The image only: the web UI ships to GitHub Pages (pages.yml).
      - name: Build and deploy to LangSmith
        if: steps.guard.outputs.superseded != 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: mise run deploy -- --no-input

      # Tagging upserts, so every deploy re-tags; it also picks up resources added since.
      - name: Tag the agent's resources
        if: steps.guard.outputs.superseded != 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: mise run agent:tag

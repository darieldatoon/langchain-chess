name: setup
description: mise tools, then the Python and/or web dependencies through Socket Firewall

inputs:
  python:
    description: uv sync the Python workspace
    default: "true"
  web:
    description: pnpm install the web workspace
    default: "true"

# Main saves the package caches (PR-scoped caches can't be read by other PRs); PRs only restore.
# Do not add restore-keys to the main steps: a store seeded from an older key keeps growing.
runs:
  using: composite
  steps:
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true
        cache_save: ${{ github.ref == 'refs/heads/main' }}

    - if: inputs.python == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv/python
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}

    - if: inputs.python == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv/python
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}
        restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-

    # `mise run setup`, but failing on a stale uv.lock and without git hooks.
    - if: inputs.python == 'true'
      shell: bash
      run: sfw uv sync --all-packages --all-groups --locked

    - if: inputs.web == 'true'
      id: pnpm
      shell: bash
      run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.web == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - if: inputs.web == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

    - if: inputs.web == 'true'
      shell: bash
      run: sfw pnpm install --frozen-lockfile

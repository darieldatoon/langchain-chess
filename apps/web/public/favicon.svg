<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- LangChain Chess favicon v2: a knight traced as one line, resolving into two nodes -->
  <!-- Tile: brand blue, corner radius 7 -->
  <rect width="32" height="32" rx="7" fill="#006DDD"/>
  <!-- Knight outline, stroke 2. Runs from the front node, up the neck, round the muzzle, over the ear, down the back.
       Mitred joins keep the throat and ear sharp; the back runs straight on x=23 so it stays crisp at 16px and 32px. -->
  <path fill="none" stroke="#F2FAFF" stroke-width="2" stroke-linejoin="miter" stroke-miterlimit="8"
    d="M11 24C11 20.8 15.2 18.6 15.8 15.1C14 16.4 11.6 17.5 9.6 17.6C8.1 17.7 6.9 16 7.4 15.1L10 10.4C11.3 8.2 13.2 6.8 15.1 6.3L16.5 4.5L17.5 6.6C20.9 7.8 23 10.8 23 14.5V24"/>
  <!-- Terminal nodes: diameter 6 = 3x the stroke; centred on x=11 and x=23 -->
  <circle cx="11" cy="24" r="3" fill="#F2FAFF"/>
  <circle cx="23" cy="24" r="3" fill="#F2FAFF"/>
</svg>

# One toolchain file for the whole repo. `mise trust && mise install && mise run setup`.
# Python comes from uv (.python-version), not mise.

[tools]
node = "24"
pnpm = "12"
uv = "0.12"
lefthook = "2"
"github:SocketDev/sfw-free" = { version = "1.15.2", bin = "sfw" }
"github:Disservin/fastchess" = "v1.8.2-alpha"
# `lcchess grade` runs it; the release binaries are named per platform.
"github:official-stockfish/Stockfish" = { version = "sf_19", bin = "stockfish" }
# `langsmith apps dev` and `langsmith apps push` for apps/review.
"github:langchain-ai/langsmith-cli" = { version = "v0.2.59", bin = "langsmith" }

[tasks.setup]
description = "Install Python and web dependencies, then git hooks"
run = [
  "sfw uv sync --all-packages --all-groups",
  "sfw pnpm install --frozen-lockfile",
  "lefthook install",
]

[tasks."dev:web"]
description = "Agent Server (Studio) on :2024 and the web UI on :5173/ui/ ($LANGGRAPH_PORT, $WEB_PORT)"
alias = "dev"
# langgraph dev silently moves to a random port when its port is taken, while the UI would keep
# calling the old one: check first, and point the UI at the same port. Vite prints its URL first
# and langgraph dev's startup logs bury it, so the URLs are printed again once both are up.
run = '''
#!/usr/bin/env bash
set -euo pipefail
port="${LANGGRAPH_PORT:-2024}"
web_port="${WEB_PORT:-5173}"
for p in "$port" "$web_port"; do
  # Both loopbacks: Vite listens on ::1 only.
  if (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null || (exec 3<>"/dev/tcp/::1/$p") 2>/dev/null; then
    echo "error: port $p is already in use; stop that server or set LANGGRAPH_PORT / WEB_PORT" >&2
    exit 1
  fi
done
# Job control puts each job in its own process group, so stopping one reaches every process it
# spawned (uvicorn's worker, Vite under pnpm) and the terminal's Ctrl-C reaches only this script.
set -m
server='' web='' announcer=''
stop() {
  for pid in $server $web $announcer; do
    kill -- "-$pid" 2>/dev/null || true
  done
  wait
}
trap stop EXIT
uv run --all-packages langgraph dev --no-browser --port "$port" </dev/null &
server=$!
VITE_API_URL="http://localhost:$port" pnpm --dir apps/web exec vp dev --port "$web_port" \
  --strictPort </dev/null &
web=$!
(
  deadline=$((SECONDS + 120))
  while ((SECONDS < deadline)); do
    if curl -sf --max-time 2 "http://127.0.0.1:$port/ok" >/dev/null \
      && curl -sf --max-time 2 "http://localhost:$web_port/ui/" >/dev/null; then
      printf '\n  ♟  Web UI:  http://localhost:%s/ui/\n' "$web_port"
      printf '     API:     http://127.0.0.1:%s\n' "$port"
      printf '     Studio:  https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:%s\n\n' "$port"
      exit 0
    fi
    sleep 0.5
  done
  echo "error: the servers were not up within 2 minutes" >&2
  exit 1
) &
announcer=$!
# The first server to exit ends the task with its status, as does a readiness timeout; the
# trap stops the rest. Polled: macOS's bash 3.2 has no `wait -n`.
watched="$server $web $announcer"
while :; do
  sleep 0.5
  for pid in $watched; do
    kill -0 "$pid" 2>/dev/null && continue
    status=0
    wait "$pid" || status=$?
    if [[ "$pid" != "$announcer" || "$status" != 0 ]]; then
      exit "$status"
    fi
    watched="$server $web"
    announcer=
  done
done
'''

[tasks."dev:review"]
description = "The review custom app in a local LangSmith sandbox, rebuilt on save"
dir = "apps/review"
run = "langsmith apps dev"

[tasks."review:size"]
description = "Build the review app and check what `langsmith apps push` would upload"
dir = "apps/review"
run = ["pnpm exec vp build", "node scripts/upload-size.mjs"]

[tasks."review:snapshot"]
description = "Build the review app's grader snapshot (Stockfish + lcchess) in your LangSmith workspace"
run = "uv run --all-packages --env-file .env python scripts/grader-snapshot.py"

[tasks."dev:tui"]
description = "Play the agent in the terminal (Textual); pass lcchess play options after --"
run = "uv run --all-packages --env-file .env lcchess play"

[tasks."dev:uci"]
description = "Run the agent as a UCI engine on stdin/stdout; pass lcchess uci options after --"
run = "uv run --all-packages --env-file .env lcchess uci"

[tasks.check]
description = "Format check, lint and type check, Python and web"
depends = ["check:python", "check:web"]

[tasks."check:python"]
description = "Ruff format check, ruff lint and ty"
run = [
  "uv run --all-packages ruff format --check .",
  "uv run --all-packages ruff check .",
  "uv run --all-packages ty check",
]

[tasks."check:web"]
description = "Vite+ format, lint and type check"
run = "pnpm exec vp check"

[tasks.test]
description = "Python and web tests with 100% coverage gates"
depends = ["test:python", "test:web"]

[tasks."test:python"]
description = "Python tests across CPU cores, with the 100% coverage gate"
# -n here, not in pytest addopts: a bare `pytest` stays serial for -k, --pdb and --snapshot-update.
run = "uv run --all-packages pytest -q -n auto"

[tasks."test:web"]
description = "Web tests with the 100% coverage gates"
run = "pnpm exec vp run -r test"

[tasks."test:e2e"]
description = "Build the web UI, then drive it in Chromium against langgraph dev with a fake model"
run = [
  "mise run build",
  "uv run --all-packages pytest -m e2e --no-cov -q",
]

[tasks."test:live"]
description = "The live tests against the real LLM Gateway (costs a few cents)"
run = "uv run --all-packages --env-file .env pytest -m live --no-cov -q"

[tasks."eval:positions:build"]
description = "Download or reuse a Lichess month, sample and label positions, write evals/datasets/positions/vN.jsonl (one-off; pass options after --)"
run = "uv run --all-packages lcchess-evals positions build"

[tasks."eval:positions:upload"]
description = "Create or update the LangSmith dataset from the committed JSONL, tagged vN"
run = "uv run --all-packages --env-file .env lcchess-evals positions upload"

[tasks."eval:systemone"]
description = "One System 1 experiment: -- --model ... --style ... [--split dev]"
run = "uv run --all-packages --env-file .env lcchess-evals systemone run"

[tasks."eval:systemone:baseline"]
description = "The five System 1 baseline experiments in evals/experiments/systemone-baseline.toml"
run = "uv run --all-packages --env-file .env lcchess-evals systemone baseline"

[tasks."generate:settings"]
description = "Regenerate the settings' JSON Schemas and TypeScript in packages/chess-ui from ChessContext"
run = "uv run --all-packages python -m langchain_chess_server.codegen packages/chess-ui/src/generated"

[tasks."probe:efforts"]
description = "Ask each recorded model, and any given after --, whether it takes a reasoning effort (real calls)"
run = "uv run --all-packages --env-file .env python -m langchain_chess.efforts"

[tasks.build]
description = "Build the web UI into the server package, which serves it under /ui for local runs and the e2e tests"
run = "pnpm --dir apps/web exec vp build"

[tasks.deploy]
description = "Build and push the agent image to the langchain-chess agent's production environment"
# The UI ships separately, to GitHub Pages. Deploy from CI: `langgraph deploy` sends .env as the
# deployment's secrets, and a local .env names the local environment.
run = "uv run --all-packages langgraph deploy --no-remote --agent-id langchain-chess --agent-environment production --deployment-type dev"

[tasks."agent:tag"]
description = "Tag the positions dataset and the agent's tracing projects to the langchain-chess agent"
run = "bash scripts/agent-tags.sh"

# OpenWiki is pinned per task, not in [tools]: every CI job runs `mise install`, which skips
# task tools, so only the wiki tasks install it. Bump these three pins and the one in
# .github/workflows/openwiki-update.yml together.
[tasks."wiki:init"]
description = "Generate the OpenWiki from scratch (replaces openwiki/ except INSTRUCTIONS.md)"
tools = { "npm:openwiki" = "0.6.0" }
run = [
  "bash scripts/openwiki.sh code --init --print",
  # --init keeps only INSTRUCTIONS.md from openwiki/ and drops the committed connector config.
  "git checkout -- openwiki/.langsmith.json",
]

[tasks."wiki:update"]
description = "Update the OpenWiki pages that changed code made stale (a no-op when nothing did)"
tools = { "npm:openwiki" = "0.6.0" }
run = "bash scripts/openwiki.sh code --update --print"

[tasks."wiki:view"]
description = "Browse the OpenWiki locally"
tools = { "npm:openwiki" = "0.6.0" }
run = "openwiki visualize"

[tasks."test:uci"]
description = "Smoke match under fastchess: System 1-only lcchess (Jev) against itself with another seed"
# Runs inside .uci-match/ (gitignored): fastchess writes its config.json to the working directory.
run = [
  '''mkdir -p .uci-match && cd .uci-match && fastchess \
    -engine name=jev-seed1 cmd=uv args="run --all-packages --env-file ../.env lcchess uci --policy systemone --seed 1" \
    -engine name=jev-seed2 cmd=uv args="run --all-packages --env-file ../.env lcchess uci --policy systemone --seed 2" \
    -each proto=uci st=3 timemargin=2000 \
    -rounds 1 -games 2 -maxmoves 60 -autosaveinterval 0 \
    -pgnout file=games.pgn append=false \
    -log file=fastchess.log level=warn append=false engine=true''',
  # Every game ends with a result, by the rules or the move cap: no forfeits.
  '''cd .uci-match && test "$(grep -cE '^\[Result "(1-0|0-1|1/2-1/2)"\]' games.pgn)" = 2 \
    && ! grep -E '^\[Termination' games.pgn | grep -vE '"(normal|adjudication)"' \
    && echo "test:uci: 2 games finished, no forfeits"''',
]

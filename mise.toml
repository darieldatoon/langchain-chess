# One toolchain file for the whole repo. `mise trust && mise install && mise run setup`.
# Python comes from uv (.python-version), not mise.

[tools]
node = "24"
pnpm = "12"
uv = "0.12"
lefthook = "2"
"github:SocketDev/sfw-free" = { version = "1.15.2", bin = "sfw" }
"github:Disservin/fastchess" = "v1.8.2-alpha"

[tasks.setup]
description = "Install Python and web dependencies, then git hooks"
run = [
  "uv sync --all-packages --all-groups",
  "pnpm --dir apps/web install --frozen-lockfile",
  "lefthook install",
]

[tasks.dev]
description = "Agent Server (Studio) on :2024 and Vite dev server on :5173"
run = "uv run --all-packages langgraph dev --no-browser & pnpm --dir apps/web exec vp dev; kill %1"

[tasks.check]
description = "Format check, lint and type check, Python and web"
run = [
  "uv run --all-packages ruff format --check libs apps",
  "uv run --all-packages ruff check libs apps",
  "uv run --all-packages ty check",
  "pnpm --dir apps/web exec vp check",
]

[tasks.test]
description = "Python and web tests with 100% coverage gates"
run = ["uv run --all-packages pytest -q", "pnpm --dir apps/web exec vp test --run --coverage"]

[tasks.build]
description = "Build the web UI into the server package so the image can serve it under /ui"
run = "pnpm --dir apps/web exec vp build"

[tasks.deploy]
description = "Build the UI, then build and push the image to LangSmith Deployments"
run = [
  "mise run build",
  "uv run --all-packages langgraph deploy --no-remote --name jev-chess-app --deployment-type dev",
]

[tasks.uci-match]
description = "Smoke match under fastchess: SemIf-only lcchess against itself with another seed"
# Runs inside .uci-match/ (gitignored): fastchess writes its config.json to the working directory.
run = [
  '''mkdir -p .uci-match && cd .uci-match && fastchess \
    -engine name=semif-seed1 cmd=uv args="run --all-packages --env-file ../.env lcchess uci --policy systemone --seed 1" \
    -engine name=semif-seed2 cmd=uv args="run --all-packages --env-file ../.env lcchess uci --policy systemone --seed 2" \
    -each proto=uci st=3 timemargin=2000 \
    -rounds 1 -games 2 -maxmoves 60 -autosaveinterval 0 \
    -pgnout file=games.pgn append=false \
    -log file=fastchess.log level=warn append=false engine=true''',
  # Every game ends with a result, by the rules or the move cap: no forfeits.
  '''cd .uci-match && test "$(grep -cE '^\[Result "(1-0|0-1|1/2-1/2)"\]' games.pgn)" = 2 \
    && ! grep -E '^\[Termination' games.pgn | grep -vE '"(normal|adjudication)"' \
    && echo "uci-match: 2 games finished, no forfeits"''',
]

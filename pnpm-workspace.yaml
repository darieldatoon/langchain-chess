# apps/server is Python; it has no package.json.
packages:
  - apps/web
  - apps/review
  - evals/reports
  - packages/*
# Versions shared by more than one package, so the apps and packages/chess-ui can't drift.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  "@langchain/core": ^1.2.12
  "@langchain/macaw-cli": 1.0.0-beta.0
  "@langchain/macaw-components": 1.0.0-beta.0
  "@langchain/macaw-tokens": 1.0.0-beta.0
  "@phosphor-icons/react": 2.1.10
  "@radix-ui/react-tooltip": 1.2.16
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": 4.1.11
  autoprefixer: ^10.6.1
  chess.js: ^1.4.0
  jsdom: ^30.1.0
  postcss: ^8.5.28
  react: ^19.2.8
  react-chessboard: ^5.12.1
  react-dom: ^19.2.8
  react-markdown: 10.1.0
  tailwindcss: ^3.4.19
  typescript: ~6.0.2
  vitest: 4.1.11
minimumReleaseAgeExclude:
  - "@langchain/macaw-components@1.0.0-beta.0"
  - "@langchain/macaw-tokens@1.0.0-beta.0"
  - "@langchain/macaw-cli@1.0.0-beta.0"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
